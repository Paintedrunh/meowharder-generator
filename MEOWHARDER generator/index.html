<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Resource Pack UI</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="mc-panel">
            <h1>Kreator HUD & UI</h1>
        </header>
        
        <main>
            <aside class="sidebar mc-panel" id="menu-container">
                </aside>
            
            <section class="content">
                <div class="preview-box mc-panel">
                    <h2 id="preview-title">Podgląd</h2>
                    <div class="preview-bg">
                        <img id="preview-image" src="" alt="Podgląd elementu" class="pixelated">
                    </div>
                </div>
                
                <div class="variants-box" id="variants-container">
                    </div>
            </section>
        </main>

        <footer class="mc-panel">
            <div class="meta-inputs">
                <input type="text" id="pack-name" class="mc-input" placeholder="Nazwa paczki" value="MyCustomUI">
                <input type="text" id="pack-desc" class="mc-input" placeholder="Opis paczki" value="Stworzone w generatorze">
            </div>
            <button id="generate-btn" class="mc-btn-large">Wygeneruj Resource Pack</button>
        </footer>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content mc-panel">
            <button id="close-modal" class="mc-close-btn">X</button>
            
            <h2 style="margin-top: 0; font-size: 32px;">Pobieranie zakończone!</h2>
            <p style="font-size: 22px;">Dziękujemy za skorzystanie z generatora.</p>
            <p style="color: #55ff55; font-size: 20px;">Twój plik .zip znajduje się w folderze Pobrane.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
